<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t">
  <title id="t">A protein chain with nitro groups attached to tyrosine residues. Illustration only.</title>
  <rect width="1600" height="900" fill="#E7EDF8"/>
  <!-- backbone -->
  <path d="M150,560 C250,420 350,420 450,560 C550,700 650,700 750,560 C850,420 950,420 1050,560 C1150,700 1250,700 1350,560 L1450,460" fill="none" stroke="#44536C" stroke-width="10" stroke-linecap="round"/>
  <g fill="#FFFFFF" stroke="#0E2841" stroke-width="5">
    <circle cx="150" cy="560" r="30"/><circle cx="250" cy="455" r="30"/><circle cx="350" cy="455" r="30"/><circle cx="450" cy="560" r="30"/>
    <circle cx="550" cy="665" r="30"/><circle cx="650" cy="665" r="30"/><circle cx="750" cy="560" r="30"/><circle cx="850" cy="455" r="30"/>
    <circle cx="950" cy="455" r="30"/><circle cx="1050" cy="560" r="30"/><circle cx="1150" cy="665" r="30"/><circle cx="1250" cy="665" r="30"/>
    <circle cx="1350" cy="560" r="30"/><circle cx="1450" cy="460" r="30"/>
  </g>
  <!-- tyrosine ring 1 with nitro group -->
  <g transform="translate(450 330)">
    <line x1="0" y1="200" x2="0" y2="70" stroke="#0E2841" stroke-width="6"/>
    <polygon points="0,-70 60,-35 60,35 0,70 -60,35 -60,-35" fill="#FFFFFF" stroke="#0E2841" stroke-width="6"/>
    <line x1="0" y1="-70" x2="0" y2="-120" stroke="#0E2841" stroke-width="6"/>
    <text x="0" y="-135" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="30" font-weight="700" fill="#0E2841">OH</text>
    <line x1="60" y1="-35" x2="120" y2="-70" stroke="#0E2841" stroke-width="6"/>
    <rect x="120" y="-105" width="110" height="60" rx="10" fill="#FFC000" stroke="#0E2841" stroke-width="5"/>
    <text x="175" y="-62" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="32" font-weight="700" fill="#0E2841">NO2</text>
  </g>
  <!-- tyrosine ring 2 with nitro group -->
  <g transform="translate(1050 330)">
    <line x1="0" y1="200" x2="0" y2="70" stroke="#0E2841" stroke-width="6"/>
    <polygon points="0,-70 60,-35 60,35 0,70 -60,35 -60,-35" fill="#FFFFFF" stroke="#0E2841" stroke-width="6"/>
    <line x1="0" y1="-70" x2="0" y2="-120" stroke="#0E2841" stroke-width="6"/>
    <text x="0" y="-135" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="30" font-weight="700" fill="#0E2841">OH</text>
    <line x1="60" y1="-35" x2="120" y2="-70" stroke="#0E2841" stroke-width="6"/>
    <rect x="120" y="-105" width="110" height="60" rx="10" fill="#FFC000" stroke="#0E2841" stroke-width="5"/>
    <text x="175" y="-62" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="32" font-weight="700" fill="#0E2841">NO2</text>
  </g>
  <!-- reactive nitrogen species hint: small radicals -->
  <g fill="#1A4CC8">
    <circle cx="300" cy="200" r="9"/><circle cx="340" cy="170" r="6"/><circle cx="700" cy="230" r="9"/><circle cx="740" cy="190" r="6"/>
    <circle cx="1300" cy="250" r="9"/><circle cx="1340" cy="210" r="6"/>
  </g>
</svg>
