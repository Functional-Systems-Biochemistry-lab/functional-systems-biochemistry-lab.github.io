<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t">
  <title id="t">A protein chain with marked modification sites such as phosphate and glycan groups. Illustration only.</title>
  <rect width="1600" height="900" fill="#E7EDF8"/>
  <!-- backbone -->
  <path d="M150,520 C250,380 350,380 450,520 C550,660 650,660 750,520 C850,380 950,380 1050,520 C1150,660 1250,660 1350,520 L1450,420" fill="none" stroke="#44536C" stroke-width="10" stroke-linecap="round"/>
  <!-- residues -->
  <g fill="#FFFFFF" stroke="#0E2841" stroke-width="5">
    <circle cx="150" cy="520" r="30"/><circle cx="250" cy="415" r="30"/><circle cx="350" cy="415" r="30"/><circle cx="450" cy="520" r="30"/>
    <circle cx="550" cy="625" r="30"/><circle cx="650" cy="625" r="30"/><circle cx="750" cy="520" r="30"/><circle cx="850" cy="415" r="30"/>
    <circle cx="950" cy="415" r="30"/><circle cx="1050" cy="520" r="30"/><circle cx="1150" cy="625" r="30"/><circle cx="1250" cy="625" r="30"/>
    <circle cx="1350" cy="520" r="30"/><circle cx="1450" cy="420" r="30"/>
  </g>
  <!-- phosphate on residue 4 -->
  <line x1="450" y1="490" x2="450" y2="360" stroke="#0E2841" stroke-width="6"/>
  <circle cx="450" cy="320" r="44" fill="#FFC000" stroke="#0E2841" stroke-width="5"/>
  <text x="450" y="334" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="40" font-weight="700" fill="#0E2841">P</text>
  <!-- phosphate on residue 10 -->
  <line x1="1050" y1="490" x2="1050" y2="360" stroke="#0E2841" stroke-width="6"/>
  <circle cx="1050" cy="320" r="44" fill="#FFC000" stroke="#0E2841" stroke-width="5"/>
  <text x="1050" y="334" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="40" font-weight="700" fill="#0E2841">P</text>
  <!-- glycan on residue 8 -->
  <g stroke="#0E2841" stroke-width="6" fill="#1A4CC8">
    <line x1="850" y1="385" x2="850" y2="300"/>
    <line x1="850" y1="300" x2="790" y2="230"/>
    <line x1="850" y1="300" x2="910" y2="230"/>
    <line x1="910" y1="230" x2="910" y2="150"/>
    <rect x="825" y="275" width="50" height="50" rx="6"/>
    <circle cx="790" cy="230" r="26"/>
    <circle cx="910" cy="230" r="26"/>
    <polygon points="910,120 936,165 884,165"/>
  </g>
  <!-- acetyl on residue 12 -->
  <line x1="1250" y1="655" x2="1250" y2="740" stroke="#0E2841" stroke-width="6"/>
  <rect x="1215" y="740" width="70" height="50" rx="10" fill="#FFFFFF" stroke="#0E2841" stroke-width="5"/>
  <text x="1250" y="776" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="30" font-weight="700" fill="#0E2841">Ac</text>
</svg>
