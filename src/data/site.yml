nav:
  header:
    - { key: home, path: "/" }
    - { key: faculty, path: "/faculty" }
    - { key: research, path: "/research" }
    - { key: facility, path: "/facility" }
    - { key: publications, path: "/publications" }
    - { key: members, path: "/members" }
    - { key: contact, path: "/contact" }
  # 메뉴가 8개를 넘으므로 News·Gallery 는 푸터로 (§4)
