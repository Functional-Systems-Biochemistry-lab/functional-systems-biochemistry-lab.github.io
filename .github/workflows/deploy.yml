# GitHub Pages 배포 (Astro 공식 가이드 기준)
# - main 브랜치에 push 되면 check(자동 검사) → build → deploy 순서로 돕니다. 검사가 실패하면 배포하지 않습니다.
# - main 으로 오는 pull request 에서는 check 잡만 돌고 build·deploy 는 건너뜁니다.
# - 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 설정해야 동작합니다.
# - 배포 주소 기본값은 astro.config.mjs 에 있습니다: https://functional-systems-biochemistry-lab.github.io (base /).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # 배포 전 자동 검사 (CLAUDE.md §7.5): npm ci → pubs:check(논문 bib) → build → check(스키마·i18n·내부 링크·그림 alt).
  # pubs:check 는 경고만 있으면 통과하고, 오류(DOI 중복·알 수 없는 keywords·필수 필드 누락 등)가 있을 때만 실패합니다.
  # 빨간 X 가 뜨면 Actions 탭에서 이 잡의 로그를 봅니다 (docs/MAINTAINING.md 7).
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Check publications (pubs:check)
        run: npm run pubs:check
      - name: Build (check needs dist for link and alt checks)
        run: npm run build
        env:
          # build 잡과 같은 값 — 설명은 아래 build 잡의 주석 참고
          PUBLIC_DRAFT_BANNER: "true"
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
      - name: Check site (schema, i18n, links, alt)
        run: npm run check

  build:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install, build, and upload the site
        uses: withastro/action@v6
        with:
          node-version: 24
        env:
          # 공개 전까지 상단 Draft 띠 유지. 띠가 켜진 동안 robots.txt 는 Disallow: /, 모든 페이지에 noindex 메타가 들어갑니다.
          # 공개 시 false 로 바꾸면 띠·noindex·robots 차단이 함께 풀립니다 (CLAUDE.md §10 공개 체크리스트).
          PUBLIC_DRAFT_BANNER: "true"
          # 다른 주소로 시험 배포할 때만 저장소 Settings → Secrets and variables → Actions → Variables 에 넣습니다.
          # 비어 있으면 astro.config.mjs 의 기본값을 씁니다.
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    # 배포는 한 번에 하나씩, 진행 중인 배포는 취소하지 않음. check 잡에는 concurrency 를 두지 않아 PR 마다 따로 돌고 서로 막지 않습니다.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
