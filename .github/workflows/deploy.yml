# GitHub Pages 배포 (Astro 공식 가이드 기준)
# - main 브랜치에 push 되면 빌드 후 배포합니다.
# - 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 설정해야 동작합니다.
# - 배포 주소 기본값은 astro.config.mjs 에 있습니다: https://functional-systems-biochemistry-lab.github.io (base /).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install, build, and upload the site
        uses: withastro/action@v6
        with:
          node-version: 24
        env:
          # 공개 전까지 상단 Draft 띠 유지. 띠가 켜진 동안 robots.txt 는 Disallow: /, 모든 페이지에 noindex 메타가 들어갑니다.
          # 공개 시 false 로 바꾸면 띠·noindex·robots 차단이 함께 풀립니다 (CLAUDE.md §10 공개 체크리스트).
          PUBLIC_DRAFT_BANNER: "true"
          # 다른 주소로 시험 배포할 때만 저장소 Settings → Secrets and variables → Actions → Variables 에 넣습니다.
          # 비어 있으면 astro.config.mjs 의 기본값을 씁니다.
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
